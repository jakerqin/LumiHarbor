services:


  backend:
    build: ./backend
    container_name: lumiharbor-backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-admin}:${MYSQL_PASSWORD:-lumipass}@db:3306/${MYSQL_DATABASE:-lumiharbor}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend:/app
      - ${NAS_DATA_PATH:-./data/nas}:/nas/data
    depends_on:
      - qdrant
    ports:
      - "8000:8000"


  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  frontend:
    build: ./frontend
    container_name: lumiharbor-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      MEDIA_BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
